name: Build NootedGreen + HookCase for Tiger Lake

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Tiger Lake patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          graphics_plist = Path(
              "sle_Internal/le/AppleIntelTGLGraphics.kext/Contents/Info.plist"
          )
          with graphics_plist.open("rb") as stream:
              root = plistlib.load(stream)

          matches = []
          def walk(value):
              if isinstance(value, dict):
                  for key, item in value.items():
                      if key == "IOPCIPrimaryMatch":
                          matches.append(str(item).lower())
                      walk(item)
              elif isinstance(value, list):
                  for item in value:
                      walk(item)

          walk(root)
          if not any("0x9a498086" in value for value in matches):
              raise SystemExit("ERROR: AppleIntelTGLGraphics.kext does not match 8086:9A49")

          hook_source = Path("HookCase-master/HookCase/HookCase.cpp").read_text()
          expected = hook_source.count("#if defined(HOOKCASE_TIGER_LAKE)")
          if expected != 2:
              raise SystemExit(f"ERROR: expected two Tiger Lake HookCase branches, got {expected}")
          if hook_source.count("callback->readReg32(0x44470)") != 2:
              raise SystemExit("ERROR: expected two Tiger Lake register reads at 0x44470")

          print("Tiger Lake graphics match and HookCase source checks passed.")
          PY

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build NootedGreen
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project NootedGreen.xcodeproj \
            -scheme NootedGreen \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath "$RUNNER_TEMP/NootedGreenDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Tiger Lake HookCase
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project HookCase-master/HookCase.xcodeproj \
            -scheme HookCase \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath "$RUNNER_TEMP/HookCaseDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            'GCC_PREPROCESSOR_DEFINITIONS=$(inherited) HOOKCASE_TIGER_LAKE=1' \
            build

      - name: Package source-built kexts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          NGREEN_KEXT="$(find "$RUNNER_TEMP/NootedGreenDerivedData/Build/Products" \
            -type d -path "*/Release/NootedGreen.kext" -print -quit)"
          HOOKCASE_KEXT="$(find "$RUNNER_TEMP/HookCaseDerivedData/Build/Products" \
            -type d -path "*/Release/HookCase.kext" -print -quit)"

          if [[ -z "$NGREEN_KEXT" || ! -d "$NGREEN_KEXT" ]]; then
            echo "ERROR: NootedGreen.kext was not produced."
            exit 1
          fi
          if [[ -z "$HOOKCASE_KEXT" || ! -d "$HOOKCASE_KEXT" ]]; then
            echo "ERROR: HookCase.kext was not produced."
            exit 1
          fi

          ditto "$NGREEN_KEXT" dist/NootedGreen.kext
          ditto "$HOOKCASE_KEXT" dist/HookCase-TGL.kext
          cp sle_Internal/le/AppleIntelTGLGraphics.kext/Contents/Info.plist \
             dist/AppleIntelTGLGraphics-Info.plist

          cat > dist/README.txt <<'EOF'
          NootedGreen / HookCase Tiger Lake development build
          Target: Intel Tiger Lake Iris Xe 8086:9A49
          macOS tested by this workflow: build environment only; runtime acceleration is NOT validated.

          Contents:
          - NootedGreen.kext: built from this repository revision.
          - HookCase-TGL.kext: built with HOOKCASE_TIGER_LAKE=1 (port-mode register 0x44470).
          - AppleIntelTGLGraphics-Info.plist: patched metadata from the repository's
            sle_Internal/le/AppleIntelTGLGraphics.kext. It is not a complete driver kext.

          The complete Apple driver kext bundles remain in the repository under
          sle_Internal/le/. Do not mix driver files from different macOS builds.
          Keep a known-good EFI and recovery boot path. This experimental build does
          not guarantee Metal/3D acceleration on genuine Tiger Lake hardware.
          EOF

      - name: Upload Tiger Lake build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NootedGreen-TigerLake-development
          path: dist/
          if-no-files-found: error
