name: Build NootedGreen + HookCase for Tiger Lake

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Tiger Lake patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          graphics_paths = [
              Path("sle_Internal/le/AppleIntelTGLGraphics.kext/Contents/Info.plist"),
              Path("sle_Internal/le/AppleIntelTGLGraphicsFramebuffer.kext/Contents/Info.plist"),
          ]
          for path in graphics_paths:
              with path.open("rb") as stream:
                  root = plistlib.load(stream)

              matches = []
              def walk(value):
                  if isinstance(value, dict):
                      for key, item in value.items():
                          if key == "IOPCIPrimaryMatch":
                              matches.append(str(item).lower())
                          walk(item)
                  elif isinstance(value, list):
                      for item in value:
                          walk(item)

              walk(root)
              if not any("0x9a498086" in value for value in matches):
                  raise SystemExit(
                      f"ERROR: {path} does not match Intel device 8086:9A49"
                  )
              if "org.smichaud.HookCase" not in root.get("OSBundleLibraries", {}):
                  raise SystemExit(
                      f"ERROR: {path} does not declare its HookCase dependency"
                  )

          hook_source = Path("HookCase-master/HookCase/HookCase.cpp").read_text()
          expected = hook_source.count("#if defined(HOOKCASE_TIGER_LAKE)")
          if expected != 2:
              raise SystemExit(f"ERROR: expected two Tiger Lake HookCase branches, got {expected}")
          if hook_source.count("callback->readReg32(0x44470)") != 2:
              raise SystemExit("ERROR: expected two Tiger Lake register reads at 0x44470")

          print("Tiger Lake GPU match, HookCase dependency, and source checks passed.")
          PY

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build NootedGreen
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project NootedGreen.xcodeproj \
            -scheme NootedGreen \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath "$RUNNER_TEMP/NootedGreenDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Tiger Lake HookCase
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project HookCase-master/HookCase.xcodeproj \
            -scheme HookCase \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath "$RUNNER_TEMP/HookCaseDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            'GCC_PREPROCESSOR_DEFINITIONS=$(inherited) HOOKCASE_TIGER_LAKE=1' \
            build

      - name: Package unsigned development kexts and original-signed user-space bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/EFI/OC/Kexts dist/LibraryExtensions

          NGREEN_KEXT="$(find "$RUNNER_TEMP/NootedGreenDerivedData/Build/Products" \
            -type d -path "*/Release/NootedGreen.kext" -print -quit)"
          HOOKCASE_KEXT="$(find "$RUNNER_TEMP/HookCaseDerivedData/Build/Products" \
            -type d -path "*/Release/HookCase.kext" -print -quit)"

          if [[ -z "$NGREEN_KEXT" || ! -d "$NGREEN_KEXT" ]]; then
            echo "ERROR: NootedGreen.kext was not produced."
            exit 1
          fi
          if [[ -z "$HOOKCASE_KEXT" || ! -d "$HOOKCASE_KEXT" ]]; then
            echo "ERROR: HookCase.kext was not produced."
            exit 1
          fi

          # Keep all kernel extensions in the OpenCore staging directory. This avoids
          # asking kmutil to add unsigned development kexts to the Auxiliary KC, and
          # keeps the Lilu plugin next to the Lilu dependency that provides it.
          ditto Lilu.kext dist/EFI/OC/Kexts/Lilu.kext
          ditto "$NGREEN_KEXT" dist/EFI/OC/Kexts/NootedGreen.kext
          ditto "$HOOKCASE_KEXT" dist/EFI/OC/Kexts/HookCase-TGL.kext
          ditto sle_Internal/le/AppleIntelTGLGraphics.kext dist/EFI/OC/Kexts/AppleIntelTGLGraphics.kext
          ditto sle_Internal/le/AppleIntelTGLGraphicsFramebuffer.kext dist/EFI/OC/Kexts/AppleIntelTGLGraphicsFramebuffer.kext

          for name in \
            AppleIntelGraphicsShared.bundle \
            AppleIntelTGLGraphicsGLDriver.bundle \
            AppleIntelTGLGraphicsMTLDriver.bundle \
            AppleIntelTGLGraphicsVADriver.bundle \
            AppleIntelTGLGraphicsVAME.bundle; do
            ditto "sle_Internal/sle/$name" "dist/LibraryExtensions/$name"
          done

          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            dist/EFI/OC/Kexts/HookCase-TGL.kext/Contents/Info.plist > "$RUNNER_TEMP/hookcase-id.txt"
          HOOKCASE_ID="$(cat "$RUNNER_TEMP/hookcase-id.txt")"
          if [[ "$HOOKCASE_ID" != "org.smichaud.HookCase" ]]; then
            echo "ERROR: HookCase bundle identifier is '$HOOKCASE_ID', expected org.smichaud.HookCase."
            exit 1
          fi

          # The modified Apple TGL kext Info.plists no longer match their original
          # Apple signatures. For local Hackintosh testing with SIP's kext-signing
          # enforcement disabled, package the three kernel extensions unsigned.
          # Do NOT ad-hoc sign them: kmutil can reject ad-hoc-signed kexts as a
          # "Bad code signature". Remove both Mach-O signatures and bundle seals.
          for bundle in \
            dist/EFI/OC/Kexts/NootedGreen.kext \
            dist/EFI/OC/Kexts/HookCase-TGL.kext \
            dist/EFI/OC/Kexts/AppleIntelTGLGraphics.kext \
            dist/EFI/OC/Kexts/AppleIntelTGLGraphicsFramebuffer.kext; do
            if [[ -d "$bundle/Contents/MacOS" ]]; then
              while IFS= read -r -d '' executable; do
                /usr/bin/codesign --remove-signature "$executable" >/dev/null 2>&1 || true
              done < <(find "$bundle/Contents/MacOS" -type f -print0)
            fi
            rm -rf "$bundle/Contents/_CodeSignature"
          done

          # Keep the companion user-space bundles byte-for-byte as checked out.
          # These legacy Apple bundles can report "resource envelope is obsolete"
          # under newer codesign versions. This warning is recorded but not treated
          # as a packaging failure; the source bundles are not altered or re-signed.
          for bundle in dist/LibraryExtensions/*.bundle; do
            echo "Checking legacy Apple bundle signature: $bundle"
            if ! codesign --verify --deep --verbose=2 "$bundle"; then
              echo "::warning::Legacy bundle signature verification reported a warning/error for $bundle; source files are retained unchanged."
              codesign -dv --verbose=4 "$bundle" 2>&1 || true
            fi
          done

          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          root = Path("dist")
          kext_root = root / "EFI/OC/Kexts"
          library_root = root / "LibraryExtensions"

          def read_plist(path):
              with path.open("rb") as stream:
                  return plistlib.load(stream)

          def version(value):
              try:
                  return tuple(int(part) for part in str(value).split("."))
              except ValueError:
                  raise SystemExit(f"ERROR: invalid version string: {value!r}")

          # A Lilu plugin must declare the same minimum version that the README requires.
          lilu = read_plist(kext_root / "Lilu.kext/Contents/Info.plist")
          ngreen = read_plist(kext_root / "NootedGreen.kext/Contents/Info.plist")
          required_lilu = ngreen.get("OSBundleLibraries", {}).get("as.vit9696.Lilu")
          if lilu.get("CFBundleIdentifier") != "as.vit9696.Lilu":
              raise SystemExit("ERROR: bundled Lilu.kext has the wrong bundle identifier")
          if version(lilu.get("CFBundleVersion", "0")) < (1, 7, 2):
              raise SystemExit("ERROR: bundled Lilu is older than 1.7.2")
          if not required_lilu or version(required_lilu) < (1, 7, 2):
              raise SystemExit("ERROR: NootedGreen must require Lilu 1.7.2 or newer")

          for name in (
              "AppleIntelTGLGraphics.kext",
              "AppleIntelTGLGraphicsFramebuffer.kext",
          ):
              path = kext_root / name / "Contents/Info.plist"
              root_plist = read_plist(path)
              if "org.smichaud.HookCase" not in root_plist.get("OSBundleLibraries", {}):
                  raise SystemExit(f"ERROR: {name} has no HookCase dependency")
              matches = []
              def walk(value):
                  if isinstance(value, dict):
                      for key, item in value.items():
                          if key == "IOPCIPrimaryMatch":
                              matches.append(str(item).lower())
                          walk(item)
                  elif isinstance(value, list):
                      for item in value:
                          walk(item)
              walk(root_plist)
              if not any("0x9a498086" in match for match in matches):
                  raise SystemExit(f"ERROR: {name} does not match device 8086:9A49")

          hookcase = read_plist(kext_root / "HookCase-TGL.kext/Contents/Info.plist")
          if hookcase.get("CFBundleIdentifier") != "org.smichaud.HookCase":
              raise SystemExit("ERROR: HookCase bundle identifier is wrong")

          expected_kexts = {
              "Lilu.kext", "NootedGreen.kext", "HookCase-TGL.kext",
              "AppleIntelTGLGraphics.kext",
              "AppleIntelTGLGraphicsFramebuffer.kext",
          }
          actual_kexts = {p.name for p in kext_root.glob("*.kext")}
          if actual_kexts != expected_kexts:
              raise SystemExit(
                  f"ERROR: wrong OpenCore kext staging set: {sorted(actual_kexts)}"
              )
          if list(library_root.glob("*.kext")):
              raise SystemExit("ERROR: kernel extensions must not be staged with user-space bundles")
          expected_bundles = {
              "AppleIntelGraphicsShared.bundle",
              "AppleIntelTGLGraphicsGLDriver.bundle",
              "AppleIntelTGLGraphicsMTLDriver.bundle",
              "AppleIntelTGLGraphicsVADriver.bundle",
              "AppleIntelTGLGraphicsVAME.bundle",
          }
          actual_bundles = {p.name for p in library_root.glob("*.bundle")}
          if actual_bundles != expected_bundles:
              raise SystemExit(
                  f"ERROR: wrong user-space bundle staging set: {sorted(actual_bundles)}"
              )

          print("OpenCore kext layout, Lilu dependency, 9A49 matching, and user-space bundle layout validated.")
          PY

          cat > dist/README.txt <<'EOF'
          NootedGreen / HookCase Tiger Lake development build
          Target: Intel Tiger Lake Iris Xe device 8086:9A49
          Runtime graphics acceleration is NOT validated by this workflow.

          Layout
          ------
          EFI/OC/Kexts/ contains the five kernel extensions:
            Lilu.kext
            NootedGreen.kext
            HookCase-TGL.kext
            AppleIntelTGLGraphicsFramebuffer.kext
            AppleIntelTGLGraphics.kext

          LibraryExtensions/ contains the five companion user-space .bundle packages.

          OpenCore installation
          ---------------------
          Copy the five .kext folders from EFI/OC/Kexts/ into the existing EFI's
          EFI/OC/Kexts/ directory. Do NOT replace the whole EFI or config.plist.
          Add/enable them under Kernel -> Add in this order:
            1. Lilu.kext
            2. NootedGreen.kext
            3. HookCase-TGL.kext
            4. AppleIntelTGLGraphicsFramebuffer.kext
            5. AppleIntelTGLGraphics.kext

          NootedGreen is a Lilu plugin. Lilu 1.7.2 or newer must be enabled before
          NootedGreen. If your EFI already has a newer Lilu, keep that version and
          do not add a duplicate Lilu entry; only use the bundled Lilu if needed.
          Do not install NootedGreen.kext into /Library/Extensions.

          User-space bundle installation
          -------------------------------
          Only the five .bundle folders from LibraryExtensions/ belong in
          /Library/Extensions/. Preserve their contents and existing file modes;
          do not ad-hoc re-sign the legacy Apple bundles. The GPU bundle lookup
          patch expects them in /Library/Extensions, not /Library/GPUBundles.

          Signature and test limitations
          --------------------------------
          The four non-Lilu kernel extensions in this experiment are intentionally
          unsigned because the modified Apple driver Info.plists no longer match
          their original Apple seals. They are staged for OpenCore injection, not
          for kmutil/Auxiliary Kernel Collection installation. Do not put these
          unsigned .kext folders in /Library/Extensions and do not run kmutil
          create --update-all for this package.

          Preserve a known-good EFI and recovery path. Build success does not
          demonstrate a successful boot, display initialization, or Metal support.
          For genuine Tiger Lake, -ngreentglwithgfx loads both framebuffer and
          accelerator drivers; -ngreentglfb is diagnostic-only and may not produce
          a coherent display. Do not enable experimental 3D acceleration until
          the base display path is confirmed stable.
          EOF

      - name: Upload Tiger Lake build artifact
        uses: actions/upload-artifact@v7
        with:
          name: NootedGreen-TigerLake-development
          path: dist/
          if-no-files-found: error
