
name: Build NootedGreen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build NootedGreen
        run: |
          xcodebuild \
            -project NootedGreen.xcodeproj \
            -scheme NootedGreen \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Collect kext
        run: |
          mkdir -p dist

          find "$RUNNER_TEMP/DerivedData/Build/Products" \
            -type d -name "NootedGreen.kext" \
            -exec cp -R {} dist/ \;

          if [ ! -d "dist/NootedGreen.kext" ]; then
            echo "NootedGreen.kext was not produced."
            exit 1
          fi

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: NootedGreen-build
          path: dist/NootedGreen.kext
          if-no-files-found: error
